<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盤面エディタ（開発者用）</title>
<!-- 盤面部品が使うクラスの定義（ルートの style.css）。エディタ自身の見た目は editor.css -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/editor.css">
</head>
<body class="editor-body">
<div id="topbar">
  <span class="dev-badge">開発者用</span>
  <h1>盤面エディタ</h1>
  <button type="button" class="btn" id="undo" disabled>元に戻す</button>
  <button type="button" class="btn" id="redo" disabled>やり直し</button>
  <span class="sp"></span>
  <span class="hint">ホイールで拡大縮小</span>
  <span class="zoom" id="zoom">100%</span>
  <button type="button" class="btn" id="zoom-reset">100%に戻す</button>
</div>
<div id="cols">
  <aside id="palette"><div class="hd">パレット</div><div id="plist"></div></aside>
  <aside id="steps">
    <div class="hd">レッスンの面</div>
    <div class="steps-ctl">
      <select id="lesson-select"><option value="">レッスンを選ぶ</option></select>
      <div class="steps-btns">
        <button type="button" class="btn sm" id="step-up" disabled>↑</button>
        <button type="button" class="btn sm" id="step-down" disabled>↓</button>
        <button type="button" class="btn sm" id="step-dup" disabled>複製して追加</button>
        <button type="button" class="btn sm" id="step-replace" disabled>この盤面で置き換え</button>
        <button type="button" class="btn sm" id="step-pin" disabled>固定する</button>
        <button type="button" class="btn sm" id="step-add" disabled>この盤面を面として追加</button>
        <button type="button" class="btn sm" id="step-del" disabled>削除</button>
        <button type="button" class="btn sm" id="lesson-save" disabled>保存</button>
      </div>
    </div>
    <div class="drafts-ctl">
      <input type="text" id="draft-name" placeholder="下書きの名前（a-z 0-9 -）" maxlength="60">
      <button type="button" class="btn sm" id="draft-save">下書き保存</button>
      <select id="draft-select"><option value="">下書きを選ぶ</option></select>
      <button type="button" class="btn sm" id="draft-load" disabled>読み込む</button>
    </div>
    <div id="step-list"></div>
    <div id="step-warn"></div>
    <div id="save-ng"></div>
  </aside>
  <main id="center">
    <div id="boardArea"><div id="board"></div></div>
    <div id="status"></div>
  </main>
  <aside id="settings"><div class="hd">せってい</div><div class="empty">設定なし<br><span class="note">（#404 で選んだ物の設定欄を入れる空枠）</span></div></aside>
</div>
<script type="module" src="/editor.js"></script>
</body>
</html>
