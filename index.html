<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>すすむ | steam-kids</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-[100dvh] wood-bg touch-manipulation">
<div id="app" class="w-full max-w-3xl mx-auto h-[100dvh] flex flex-col p-2 sm:p-4">
  <header class="flex justify-between items-center gap-2 mb-2 shrink-0">
    <div id="lesson-header" class="items-center gap-2 min-w-0" style="display:none">
      <button id="back-btn" type="button" data-action="back" aria-label="まえの がめんへ"
        class="min-w-[64px] min-h-[64px] flex items-center justify-center rounded-lg bg-white shadow text-xl transition-transform duration-100 active:scale-95 disabled:opacity-40">←</button>
      <div class="min-w-0 leading-tight">
        <p id="lesson-title" class="text-sm font-bold truncate"></p>
        <span id="step-kind-chip" class="inline-block text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-700"></span>
      </div>
    </div>
    <div class="flex items-center gap-2 ml-auto">
    <!-- 🏠は#lesson-headerの外（もどると離れた右側）に置く。誤タップで両方押してしまうのを
         防ぐための配置分離（確認ダイアログ全廃の代わり。Issue #95） -->
    <button id="home-btn" type="button" data-action="home" aria-label="えらぶ がめんへ" style="display:none"
      class="min-w-[64px] min-h-[64px] flex items-center justify-center rounded-lg bg-white shadow text-xl transition-transform duration-100 active:scale-95 disabled:opacity-40">🏠</button>
    <!-- 歯車メニュー（Issue #389）。🏠との間隔24px（ml-4＋gap-2）で誤タップを防ぐ。
         開いている間は #menu-overlay が全面を覆い、盤面・じっこうボタンへのタップを受け止める。 -->
    <div class="relative z-50 ml-4">
      <button id="gear-btn" type="button" aria-label="せってい" aria-haspopup="true" aria-expanded="false"
        class="min-w-[64px] min-h-[64px] flex items-center justify-center rounded-lg bg-white shadow text-slate-500 transition-transform duration-100 active:scale-95">
        <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1z" />
      </svg>
      </button>
      <div id="gear-menu" hidden class="absolute right-0 top-full mt-1.5 w-[200px] bg-white rounded-xl shadow-lg p-2">
        <div class="flex flex-col gap-1">
          <button id="menu-guardian" type="button" class="w-full min-h-[64px] text-xs text-slate-500 underline">ほごしゃの かた</button>
          <button id="menu-close" type="button" class="w-full min-h-[64px] rounded-lg bg-slate-200 text-slate-700 font-bold text-lg">とじる</button>
        </div>
      </div>
    </div>
    </div>
  </header>
  <div id="menu-overlay" hidden class="fixed inset-0 z-40 bg-slate-900/45"></div>
  <div id="guardian-confirm" hidden class="fixed inset-0 z-[60]">
    <div class="w-full h-full flex items-center justify-center bg-slate-900/25">
      <div class="w-[300px] max-w-[90vw] bg-white rounded-2xl shadow-xl p-4 flex flex-col gap-4">
        <p class="text-lg font-bold text-slate-700 text-center">おとなの かたへ</p>
        <div class="flex gap-3 justify-center">
          <button id="guardian-go" type="button" class="min-h-[64px] min-w-[112px] rounded-lg bg-sky-500 text-white font-bold text-lg">すすむ</button>
          <button id="guardian-cancel" type="button" class="min-h-[64px] min-w-[112px] rounded-lg bg-slate-200 text-slate-700 font-bold text-lg">やめる</button>
        </div>
      </div>
    </div>
  </div>
  <main id="stage" class="bg-white rounded-2xl shadow p-2 sm:p-4 flex-1 min-h-0 flex flex-col overflow-y-auto"></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
