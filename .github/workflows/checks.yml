name: Checks

# ブラウザを使わない軽い検証（数十秒）。PR ごとに自動実行。
# - 静的チェック（バージョン一致・APP_SHELL の過不足・外部読み込み禁止）
# - 単体テスト（node --test）
# - レッスン検証
# - style.css のビルド忘れ

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必須チェック（checks）を常に報告するため、paths-ignore ではなくジョブの if で省略する。
  # 変更が *.md・docs/ 配下だけなら checks を省略（省略は必須チェック上で成功扱い）。手動実行は常に実行。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: 変更パスを判定する
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=false
          if [ -z "$PR" ]; then
            code=true
          else
            FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md|docs/*) ;;
                *) code=true ;;
              esac
            done <<< "$FILES"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### 変更パスの判定: code=$code" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 依存関係（ブラウザは入れない）
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 静的チェック
        run: npm run check:static

      - name: 単体テスト
        run: npm run test:unit

      - name: レッスン検証
        run: npm run validate:lessons

      - name: style.css のビルド忘れ
        run: |
          npm run build:css
          if ! git diff --quiet -- style.css; then
            echo "::error::style.css がビルド結果と一致しません。npm run build:css を実行してコミットしてください。"
            git diff --stat -- style.css
            exit 1
          fi
