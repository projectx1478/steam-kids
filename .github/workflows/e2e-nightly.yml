name: E2E nightly

# 全件E2E。毎晩 2:00 JST（直近25時間に main へのコミットがあった日だけ）と手動実行。
# 失敗したら e2e-nightly ラベルの Issue を1件起票（未解決があればコメント追記）。

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 17:00 = JST 2:00
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: 直近にコミットがなければスキップ（手動実行は常に実行）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ -n "$(git log --since='25 hours ago' --format=%H | head -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "コミットなしのためスキップ"
          fi

      - uses: ./.github/actions/setup-e2e
        if: steps.gate.outputs.run == 'true'

      - name: E2E 全件
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          mkdir -p .verify
          npm run verify:e2e 2>&1 | tee .verify/nightly-out.txt

      - name: 赤のシナリオを単独3回再実行（決定的か揺れかを見分ける）
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          : > .verify/rerun.txt
          cp .verify/verify-all.log .verify/verify-all-full.log
          for NAME in $(grep '^FAILED: ' .verify/nightly-out.txt | sed 's/^FAILED: //' | head -5); do
            P=0; F=0
            for I in 1 2 3; do
              if npm run verify:e2e -- "$NAME" >/dev/null 2>&1; then P=$((P+1)); else F=$((F+1)); fi
            done
            if [ "$P" = 0 ]; then KIND="決定的（3回とも赤）"; else KIND="揺れ（緑$P・赤$F）"; fi
            echo "- $NAME: $KIND" >> .verify/rerun.txt
          done
          cat .verify/rerun.txt
        continue-on-error: true

      - name: ログを保存
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nightly-log
          path: .verify/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore

      - name: 失敗時に Issue を起票
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL=e2e-nightly
          gh label create "$LABEL" --color B60205 --description "夜間E2Eの失敗" 2>/dev/null || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ -f .verify/verify-all-full.log ] && cp .verify/verify-all-full.log .verify/verify-all.log
          TAIL=$( [ -f .verify/verify-all.log ] && tail -n 60 .verify/verify-all.log || echo "(ログなし。セットアップで失敗)" )
          RERUN=$( [ -s .verify/rerun.txt ] && cat .verify/rerun.txt || echo "(再実行なし)" )
          COMMITS=$(git log --since='25 hours ago' --format='%h %s' | head -20)
          BODY=$(printf '夜間E2Eが失敗しました。\n\n- コミット: %s\n- 実行ログ: %s\n\n単独3回の再実行:\n%s\n\n直近のコミット:\n```\n%s\n```\n\nログ末尾:\n```\n%s\n```\n' \
            "${{ github.sha }}" "$RUN_URL" "$RERUN" "$COMMITS" "$TAIL")
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "夜間E2E失敗 $(date -u +%Y-%m-%d)" --label "$LABEL" --body "$BODY"
          fi
