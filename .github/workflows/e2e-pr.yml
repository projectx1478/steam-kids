name: E2E PR

# PR ごとに「スモーク5本」＋「PR本文の E2E: 行に書いたシナリオ」を実行する。
# 例（PR本文の任意の行）:  E2E: les-cmd-04-repeat-box group-repeats-ui --mobile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SMOKE: app-version p3-offline lesson-picker cmd01-flow guardian-gate

jobs:
  # 必須チェック（e2e）を常に報告するため、paths-ignore ではなくジョブの if で省略する。
  # 変更が *.md・docs/ 配下だけなら e2e を省略（省略は必須チェック上で成功扱い）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: 変更パスを判定する
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=false
          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*) ;;
              *) code=true ;;
            esac
          done <<< "$FILES"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### 変更パスの判定: code=$code" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 実行するシナリオを決める
        id: pick
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          REQ=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^E2E:[[:space:]]*//p' | head -1)
          ARGS=$(bash .github/scripts/pick-scenarios.sh "$REQ" $SMOKE)
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "### 実行シナリオ" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ARGS\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-e2e

      - name: E2E
        env:
          ARGS: ${{ steps.pick.outputs.args }}
        run: npm run verify:e2e -- $ARGS

      - name: ログ・スクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pr-log
          path: .verify/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
