name: Pages

# GitHub Pages を Actions 配信にする（#397）。tools/ だけを配信物から除く。他の公開内容は従来の root 配信と同じ。
# 設定（Settings → Pages → Source を「GitHub Actions」に切り替え）は人が行う。切り替えるまでこの PR はマージしない。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 配信物を作る（tools/ と .git を除く）
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./tools --exclude=./_site -cf - . | tar -xf - -C _site
          if [ -e _site/tools ]; then
            echo "::error::tools/ が配信物に残っています。"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
