name: Pages

# GitHub Pages を Actions 配信にする（#397）。tools/ だけを配信物から除く。他の公開内容は従来の root 配信と同じ。
# 設定（Settings → Pages → Source を「GitHub Actions」に切り替え）は人が行う。切り替えるまでこの PR はマージしない。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 非公開リポジトリ steam-kids-state からの音源取得用 deploy key の有無（#378）
      STATE_KEY_SET: ${{ secrets.STATE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: 配信物を作る（tools/ と .git を除く）
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./tools --exclude=./_site -cf - . | tar -xf - -C _site
          if [ -e _site/tools ]; then
            echo "::error::tools/ が配信物に残っています。"
            exit 1
          fi

      # BGM 音源（MusMus）は規約上公開リポジトリに置かない。Pages デプロイ時に
      # 非公開リポジトリ steam-kids-state から読み取り deploy key で取得し _site/audio/ へ同名コピーする（#378）。
      # Secret 未設定・取得失敗時は警告のみで曲なし配信を続ける（失敗にはしない）。
      - name: SSH鍵を登録する（BGM音源取得用）
        if: ${{ env.STATE_KEY_SET == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STATE_DEPLOY_KEY }}

      - name: BGM音源を取得する（失敗時は曲なしで配信を続ける）
        if: ${{ env.STATE_KEY_SET == 'true' }}
        run: |
          mkdir -p _site/audio
          ssh-keygen -F github.com >/dev/null 2>&1 || ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          if ! git clone --depth 1 git@github.com:projectx1478/steam-kids-state.git /tmp/steam-kids-state; then
            echo "::warning::steam-kids-state の取得に失敗しました。BGMなしで配信を続けます。"
            exit 0
          fi
          if ! cp /tmp/steam-kids-state/bgm/*.ogg _site/audio/; then
            echo "::warning::bgm/*.ogg のコピーに失敗しました。BGMなしで配信を続けます。"
          fi
          ls -la _site/audio/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
