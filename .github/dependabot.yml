# 依存関係と GitHub Actions のバージョン更新を、PR として自動で届ける（無料）。
# 更新PRにも Checks / E2E PR が走るので、緑ならマージするだけでよい。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # tailwindcss は v3 系固定（v4 は設定・ビルド方式が異なり style.css の再生成が要る）
    ignore:
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
    groups:
      dev-tools:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
